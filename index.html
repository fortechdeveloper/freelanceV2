<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#a5b4fc" />
  <title>Beranda — freelance.fortech</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="app">

    <!-- ============ HEADER ============ -->
    <header class="header">
      <div class="brand">freelance<span>.fortech</span></div>
      <button class="header-icon" aria-label="Notifikasi">
        <i data-lucide="bell"></i>
      </button>
    </header>

    <!-- ============ GREETING ============ -->
    <div class="greeting">
      <h2>Halo, User <i data-lucide="hand"></i></h2>
    </div>

    <!-- ============ CARD SALDO ============ -->
    <section class="balance-card">
      <div class="balance-label">Saldo Kamu</div>
      <div class="balance-amount" id="saldoText">Rp 0</div>
      <div class="balance-status">
        <span class="dot"></span>
        <span>Siap ditarik</span>
      </div>
    </section>

    <!-- ============ SHORTCUT ============ -->
    <section class="section">
      <div class="section-head">
        <div class="section-title">Menu Cepat</div>
      </div>

      <div class="shortcut-grid">
        <a href="tugas.html" class="shortcut">
          <div class="shortcut-icon">
            <i data-lucide="clipboard-list"></i>
          </div>
          <div class="shortcut-label">Tugas</div>
        </a>

        <a href="wd.html" class="shortcut">
          <div class="shortcut-icon">
            <i data-lucide="wallet"></i>
          </div>
          <div class="shortcut-label">Withdraw</div>
        </a>

        <a href="riwayat.html" class="shortcut">
          <div class="shortcut-icon">
            <i data-lucide="history"></i>
          </div>
          <div class="shortcut-label">Riwayat</div>
        </a>

        <a href="akun.html" class="shortcut">
          <div class="shortcut-icon">
            <i data-lucide="user"></i>
          </div>
          <div class="shortcut-label">Akun</div>
        </a>
      </div>
    </section>

    <!-- ============ TUGAS AKTIF ============ -->
    <section class="section">
      <div class="section-head">
        <div class="section-title">Tugas Aktif</div>
        <a href="tugas.html" class="section-link">Lihat semua</a>
      </div>

      <!-- Container tugas aktif (di-render via JS) -->
      <div id="activeTaskContainer"></div>
    </section>

  </div>

  <!-- ============ BOTTOM NAV ============ -->
  <nav class="bottom-nav">
    <a href="index.html" class="nav-item active">
      <div class="icon"><i data-lucide="home"></i></div>
      <span class="label">Beranda</span>
    </a>

    <a href="tugas.html" class="nav-item">
      <div class="icon"><i data-lucide="clipboard-list"></i></div>
      <span class="label">Tugas</span>
    </a>

    <a href="wd.html" class="nav-item">
      <div class="icon"><i data-lucide="wallet"></i></div>
      <span class="label">Withdraw</span>
    </a>

    <a href="riwayat.html" class="nav-item">
      <div class="icon"><i data-lucide="history"></i></div>
      <span class="label">Riwayat</span>
    </a>

    <a href="akun.html" class="nav-item">
      <div class="icon"><i data-lucide="user"></i></div>
      <span class="label">Akun</span>
    </a>
  </nav>

  <!-- ============ SCRIPTS ============ -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    lucide.createIcons();

    /* ========== SALDO ========== */
    const saldo = Number(localStorage.getItem('fortech_saldo') || 0);
    document.getElementById('saldoText').textContent =
      'Rp ' + saldo.toLocaleString('id-ID');

    /* ========== TUGAS AKTIF ========== */
    const container   = document.getElementById('activeTaskContainer');
    const task1Active = localStorage.getItem('fortech_task1_active') === '1';
    const task1Done   = localStorage.getItem('fortech_task1_done') === '1';

    // Cek apakah ada tugas yang lagi dikerjain (belum submit)
    const hasActiveTask = task1Active && !task1Done;

    if (hasActiveTask) {
      // Render card tugas aktif
      container.innerHTML = `
        <div class="task-card">
          <div class="task-head">
            <span class="task-badge active">
              <i data-lucide="play-circle"></i> Sedang Dikerjakan
            </span>
          </div>
          <div class="task-title">
            <i data-lucide="clapperboard"></i>
            Promosi gmail.cuan4dev.biz.id
          </div>
          <div class="task-desc">
            Review website gmail.cuan4dev.biz.id di TikTok kamu, lalu submit link video-nya.
          </div>

          <div class="task-meta">
            <span class="amount">Rp1.000</span>
            <span class="per">/ 500 view</span>
          </div>

          <a href="tugas.html" class="btn btn-primary">
            <i data-lucide="arrow-right"></i>
            Lanjutkan Tugas
          </a>
        </div>
      `;
    } else {
      // Empty state
      container.innerHTML = `
        <div class="empty-state">
          <span class="emoji"><i data-lucide="clipboard-x"></i></span>
          <div class="title">Belum ada tugas aktif</div>
          <div class="desc">Yuk mulai kerjakan tugas pertamamu!</div>
        </div>
      `;
    }

    // Re-render icon Lucide (karena di-inject via JS)
    lucide.createIcons();
  </script>

</body>
</html>
